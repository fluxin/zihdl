name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y verilator iverilog
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src examples
      - name: Run unit tests and RTL verification
        run: zig build test verify -j2 --summary all
      - name: Check generated RTL is current
        run: git diff --exit-code -- out/asic_core.v
